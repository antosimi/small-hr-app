# JWT Token
# ----------------------
jwt.secret=5367566859703373367639792F423F4528WSTTD6644JGYVNDGMWGD42BVLJMBOTOT0843262GCVCBWCUJNRIIR27763NKBEI44554
jwt.expiration=86400000

logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG


