spring.application.name=hrApp
server.port = 9001
spring.main.allow-bean-definition-overriding=true

# ----------------------
# Database
# ----------------------
spring.datasource.url=jdbc:postgresql://db:5432/hr_app_db
spring.datasource.username=postgres
spring.datasource.password=12345678

#spring.datasource.url=jdbc:postgresql://localhost:5432/hr_app_db
#spring.datasource.username=postgres
#spring.datasource.password=12345678

# ----------------------
# Hibernate
# ----------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.hibernate.ddl-auto=none
#
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# ----------------------
# Flyway
# ----------------------
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.flyway.url=jdbc:postgresql://db:5432/hr_app_db
spring.flyway.user=postgres
spring.flyway.password=12345678
logging.level.org.flywaydb=DEBUG

